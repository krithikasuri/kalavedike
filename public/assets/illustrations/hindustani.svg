  <title id="title">Hindustani · a room for resonance</title>
  <desc id="description">Original imagined concert still life with a tall tanpura, a pair of tabla, a folded cloth and a small brass bowl. Scalloped architecture, radiating strings and textile details in parchment, burgundy, saffron and green. No people or faces; not a photograph or a real event depiction.</desc>
