  <title id="title">Bharatanatyam · the pleated offering</title>
  <desc id="description">Original editorial textile composition: a suspended saffron and burgundy pleated dance fan, paired ankle bells and brass stage lamps beneath a stylized temple canopy. Garment and accessories only, with no person, head or face. An imagined illustration, not a historical or real event.</desc>
