  <title id="title">Kathak · circles held in cloth</title>
  <desc id="description">An original abstract still life of a swirling burgundy dance skirt and saffron scarf, with paired ghungroo ankle-bell straps. Concentric rhythm rings and scalloped textile borders suggest turning motion. Only fabric and accessories: no people, heads or faces. An imagined sample, not a real performance.</desc>
