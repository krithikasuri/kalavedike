  <title id="title">Odissi · three flowing bends</title>
  <desc id="description">Original abstract composition of three countercurving textile ribbons inspired by tribhangi, accompanied by silver filigree jewelry and a white floral hair ornament arranged as a still life. A stepped temple arch and carved-wheel motifs frame the design. No human figure, head or face. Imagined sample artwork, not a historical depiction.</desc>
